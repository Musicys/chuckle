spring:
  jackson:
    time-zone: Asia/Shanghai
    date-format: "yyyy-MM-dd'T'HH:mm:ssXXX"  # 输出如 2025-11-17T22:25:03+08:00
  servlet:
    multipart:
      max-file-size: 1GB       # 单个文件最大大小（OSS 图床支持大文件上传）
      max-request-size: 1GB    # 整个 HTTP 请求的最大大小
      enabled: true            # 启用 multipart 处理
  mail:
    host: smtp.qq.com
    port: 465
    username: REDACTED_QQ_EMAIL
    password: REDACTED_QQ_PASSWORD
    properties:
      mail:
        smtp:
          auth: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          ssl:
            trust: smtp.qq.com
  profiles:
    active: dev
  application:
    name: lipao-backend
  # DataSource Config
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/check_blog
    username: root
    password: ${DB_PASSWORD:123456}
  #/
  # session 失效时间（分钟）
  session:
    timeout: 86400
    store-type: none
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  # redis 配置
#  redis:
#    port: 6379
#    host: localhost
#    database: 1
server:
  port: 8088
  servlet:
    context-path: /api

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  #    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名(since 3.3.0,配置后可以忽略不配置步骤2)
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)

aliyun:
  oss:
    file:
      endpoint: oss-cn-beijing.aliyuncs.com
      keyid: REDACTED_ACCESS_KEY
      keysecret: REDACTED_SECRET_KEY
      bucketname: web-scoke


gaode:
  map:
    apikey: REDACTED_GAODE_KEY

# 微信相关配置
wx:
  mp:
    app-id: ${WX_MP_APP_ID}
    secret: ${WX_MP_SECRET}
  open:
    appId: ${WX_OPEN_APP_ID}
    appSecret: ${WX_OPEN_APP_SECRET}
